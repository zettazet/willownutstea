[package]
name = "mini-client"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
mini-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rand.workspace = true
hex.workspace = true
anyhow.workspace = true
opus = "0.3"
nnnoiseless = { version = "0.5.2", default-features = false }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The client must provide its own TLS crypto backend, even when built alone.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
[target.'cfg(windows)'.dependencies]
cpal = "0.16"
windows = { version = "0.54", features = ["Win32_System_Com", "Win32_Media_Audio"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input_Ime", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_System_Memory"] }
