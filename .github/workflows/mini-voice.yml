name: Mini Voice
on:
  workflow_dispatch:
  push:
    paths: ['mini-voice/**', '.github/workflows/mini-voice.yml']
  pull_request:
    paths: ['mini-voice/**', '.github/workflows/mini-voice.yml']
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mini-voice
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - if: runner.os == 'Linux'
        run: cargo build --locked --release -p mini-server
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mini-voice-windows-x64
          path: mini-voice/dist/mini-voice-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: mini-server-linux-x64
          path: mini-voice/target/release/mini-server
